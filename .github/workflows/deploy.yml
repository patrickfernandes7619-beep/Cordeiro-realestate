name: 🚀 Build & Deploy Website via FTP

on:
  push:
    branches:
      - main  # Change to 'master' if your branch name is master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: 🔨 Build Production & Sync to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies & build production dist
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: 📂 Sync compiled 'dist/' to cPanel server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
