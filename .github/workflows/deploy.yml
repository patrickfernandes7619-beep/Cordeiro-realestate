name: 🚀 Build and Deploy React Website via FTP

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch name is master

jobs:
  web-deploy:
    name: 🎉 Compile and Sync Files
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed the cache option to prevent the lockfile error

      - name: 🔨 Install and Build Project
        run: |
          npm install
          npm run build --if-present

      - name: 📂 Sync Compiled Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/  # Uploads ONLY the compiled website files
          server-dir: ./      # Uploads directly into your FTP target folder
